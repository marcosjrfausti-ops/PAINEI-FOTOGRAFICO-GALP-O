<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Avanço Físico da Obra - Visualizador</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Script do Supabase substituindo o Firebase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden selection:bg-brand-500 selection:text-white">

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="fixed inset-0 bg-gray-100 z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.05)] w-full max-w-sm border border-gray-100">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center tracking-tight">Avanço Físico</h2>
            <input type="email" id="email-login" placeholder="E-mail corporativo" class="w-full mb-4 p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none transition-all">
            <input type="password" id="senha-login" placeholder="Senha" class="w-full mb-6 p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none transition-all">
            <button id="btn-entrar" class="w-full bg-brand-600 text-white font-bold py-3 rounded-lg hover:bg-brand-700 transition-colors shadow-sm">Acessar Painel</button>
            <p id="msg-erro" class="text-red-500 text-sm mt-4 text-center hidden"></p>
        </div>
    </div>

    <!-- CONTEÚDO DO APP -->
    <div id="app-content" class="hidden flex flex-col h-screen w-full overflow-hidden relative">
        
        <!-- Cabeçalho Global -->
        <header class="bg-white shadow-sm flex items-center justify-between p-4 z-40 relative border-b border-gray-200 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button id="btn-toggle-menu" class="text-gray-600 hover:text-brand-600 hover:bg-brand-50 focus:outline-none p-2 rounded-md transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center gap-2">
                    <svg class="w-6 h-6 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    <h1 class="text-lg font-bold text-gray-800 tracking-tight">Avanço Físico</h1>
                </div>
            </div>
            <button id="btn-sair" class="text-sm font-medium text-gray-500 hover:text-red-600 transition-colors">Sair</button>
        </header>

        <div class="flex flex-1 overflow-hidden relative">
            <div id="mobile-overlay" class="md:hidden fixed inset-0 bg-gray-900/50 z-20 opacity-0 pointer-events-none transition-opacity duration-300"></div>

            <aside id="sidebar" class="absolute left-0 top-0 h-full w-72 md:w-80 bg-white shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-30 transform transition-transform duration-300 ease-in-out border-r border-gray-200 flex flex-col">
                <div class="p-6 flex-1 overflow-y-auto no-scrollbar flex flex-col">
                    <div class="flex items-center justify-between mb-5 md:mb-6">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Filtros de Busca</h3>
                        <span id="badge-contador" class="bg-gray-100 text-gray-600 text-xs font-bold px-2 py-1 rounded-full">0</span>
                    </div>
                    
                    <div class="space-y-5 flex-1">
                        <div class="group">
                            <label for="filtro-local" class="block text-sm font-semibold text-gray-700 mb-1.5 group-hover:text-brand-600 transition-colors">Local da Obra</label>
                            <select id="filtro-local" class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block p-2.5 appearance-none cursor-pointer">
                                <option value="">Todos os locais</option>
                            </select>
                        </div>
                        
                        <div class="group">
                            <label for="filtro-posicao" class="block text-sm font-semibold text-gray-700 mb-1.5 group-hover:text-brand-600 transition-colors">Posição</label>
                            <select id="filtro-posicao" class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block p-2.5 appearance-none cursor-pointer">
                                <option value="">Todas as posições</option>
                            </select>
                        </div>

                        <div class="group">
                            <label for="filtro-data" class="block text-sm font-semibold text-gray-700 mb-1.5 group-hover:text-brand-600 transition-colors">Data do Registro</label>
                            <input type="date" id="filtro-data" class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block p-2.5 cursor-pointer">
                        </div>
                    </div>

                    <div class="mt-8 pt-4 border-t border-gray-100 flex flex-col gap-3">
                        <button id="btn-grafico" class="w-full flex items-center justify-center gap-2 bg-brand-600 text-white hover:bg-brand-700 font-medium py-2.5 px-4 rounded-lg transition-all shadow-sm focus:ring-2 focus:ring-brand-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                            VER GRÁFICO
                        </button>
                        <button id="btn-limpar" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-brand-600 font-medium py-2.5 px-4 rounded-lg transition-all shadow-sm focus:ring-2 focus:ring-gray-200">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Limpar Filtros
                        </button>
                        <button id="btn-baixar-pdf" class="w-full mt-3 flex items-center justify-center gap-2 bg-gray-800 text-white hover:bg-gray-900 font-medium py-2.5 px-4 rounded-lg transition-all shadow-sm">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            GERAR PDF
                        </button>
                    </div>
                </div>
            </aside>

            <main id="main-content" class="flex-1 h-full overflow-y-auto bg-gray-50/50 relative z-10 w-full scroll-smooth transition-all duration-300 ml-0 md:ml-80">
                <div class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto h-full flex flex-col">
                    <div id="grid-fotos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 content-start pb-10"></div>
                    
                    <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center px-4 py-12">
                        <div class="bg-gray-100 p-4 rounded-full mb-4">
                            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">Nenhuma foto encontrada</h3>
                        <p class="text-gray-500 max-w-md mx-auto">Ajuste os filtros de data, local ou posição para encontrar os registros.</p>
                        <p id="msg-carregando" class="text-brand-600 font-medium mt-4 hidden">Sincronizando com o banco de dados...</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- Modal Gráfico (Mantido) -->
        <div id="modal-grafico" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden transform scale-95 transition-transform duration-300" id="modal-content">
                <div class="flex items-center justify-between p-5 border-b border-gray-100 bg-gray-50">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Gráfico de Registros</h2>
                        <p class="text-sm text-gray-500">Volume de fotos tiradas por dia no mês selecionado</p>
                    </div>
                    <button id="btn-fechar-modal" class="text-gray-400 hover:text-red-500 p-2 rounded-lg transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="p-6">
                    <div class="flex justify-end mb-4">
                        <input type="month" id="grafico-mes-input" class="bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2">
                    </div>
                    <div class="relative h-80 w-full">
                        <canvas id="chartAvanco"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // === CONFIGURAÇÃO DO SUPABASE ===
        const supabaseUrl = 'https://sazravlfmlgidbjiguhx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhenJhdmxmbWxnaWRiamlndWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjI5MTEsImV4cCI6MjEwNDUzODkxMX0.xJ5S_rmZsF8Sf8tv9fQz2PC72G-qcAg1RLGU_yRxFTo';
        
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', () => {
            
            const DOM = {
                telaLogin: document.getElementById('tela-login'),
                appContent: document.getElementById('app-content'),
                btnEntrar: document.getElementById('btn-entrar'),
                btnSair: document.getElementById('btn-sair'),
                emailInput: document.getElementById('email-login'),
                senhaInput: document.getElementById('senha-login'),
                msgErro: document.getElementById('msg-erro'),
                selectLocal: document.getElementById('filtro-local'),
                selectPosicao: document.getElementById('filtro-posicao'),
                inputData: document.getElementById('filtro-data'),
                btnLimpar: document.getElementById('btn-limpar'),
                gridFotos: document.getElementById('grid-fotos'),
                emptyState: document.getElementById('empty-state'),
                badgeContador: document.getElementById('badge-contador'),
                msgCarregando: document.getElementById('msg-carregando'),
                btnToggleMenu: document.getElementById('btn-toggle-menu'),
                sidebar: document.getElementById('sidebar'),
                mainContent: document.getElementById('main-content'),
                mobileOverlay: document.getElementById('mobile-overlay'),
                btnGrafico: document.getElementById('btn-grafico'),
                modalGrafico: document.getElementById('modal-grafico'),
                modalContent: document.getElementById('modal-content'),
                btnFecharModal: document.getElementById('btn-fechar-modal'),
                graficoMesInput: document.getElementById('grafico-mes-input')
            };

            let chartInstance = null; 
            let baseDeDadosProcessada = []; 

            // === AUTENTICAÇÃO ===
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (session) {
                    DOM.telaLogin.classList.add('hidden');
                    DOM.appContent.classList.remove('hidden');
                    ajustarEstadoSidebarInicial();
                    inicializar(); 
                } else {
                    DOM.telaLogin.classList.remove('hidden');
                    DOM.appContent.classList.add('hidden');
                }
            });

            const fazerLogin = async () => {
                const email = DOM.emailInput.value;
                const senha = DOM.senhaInput.value;
                
                if (!email || !senha) {
                    DOM.msgErro.textContent = "Preencha todos os campos.";
                    DOM.msgErro.classList.remove('hidden');
                    return;
                }

                DOM.btnEntrar.textContent = "Verificando...";
                DOM.msgErro.classList.add('hidden');
                
                const { error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: senha,
                });

                if (error) {
                    DOM.msgErro.textContent = "E-mail ou senha incorretos.";
                    DOM.msgErro.classList.remove('hidden');
                    DOM.btnEntrar.textContent = "Acessar Painel";
                }
            };

            DOM.btnEntrar.addEventListener('click', fazerLogin);
            
            DOM.senhaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') fazerLogin();
            });

            DOM.btnSair.addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                DOM.emailInput.value = '';
                DOM.senhaInput.value = '';
                DOM.btnEntrar.textContent = "Acessar Painel";
                baseDeDadosProcessada = [];
                DOM.gridFotos.innerHTML = '';
            });

            // === LÓGICA DE DADOS (ETL NO FRONTEND) ===
            const deParaLocais = {
                "areaexternaladodireito": "Área Externa Lado Direito",
                "passeioladoesquerdo": "Passeio Lado Esquerdo",
                "fundo": "Fundo",
                "banheiro": "Banheiro",
                "fundacaofrontal": "Fundação Frontal"
            };

            const carregarDadosDoSupabase = async () => {
                DOM.gridFotos.classList.add('hidden');
                DOM.emptyState.classList.remove('hidden');
                DOM.msgCarregando.classList.remove('hidden');

                const { data, error } = await supabaseClient.from('registros_obras').select('*');
                
                DOM.msgCarregando.classList.add('hidden');

                if (error) {
                    console.error("Erro ao buscar dados do Supabase:", error);
                    return;
                }

                baseDeDadosProcessada = data.map(item => {
                    let filename = item.nome_arquivo.split('.')[0];
                    let partes = filename.split('_');
                    
                    let localStr = partes[0] || 'Indefinido';
                    let posicaoStr = partes[1] || 'Indefinido';
                    let dataStr = partes[2] || ''; 
                    
                    let dataFormatada = '';
                    if(dataStr.length === 8) {
                        dataFormatada = `${dataStr.substring(0,4)}-${dataStr.substring(4,6)}-${dataStr.substring(6,8)}`;
                    }

                    let localFormatado = deParaLocais[localStr.toLowerCase()] || (localStr.charAt(0).toUpperCase() + localStr.slice(1));

                    return {
                        caminho_original: item.caminho,
                        local_exibicao: localFormatado,
                        posicao: posicaoStr,
                        data_iso: dataFormatada,
                        mes_iso: dataFormatada ? dataFormatada.substring(0,7) : '' 
                    };
                });
            };

            const inicializar = async () => {
                DOM.selectLocal.innerHTML = '<option value="">Todos os locais</option>';
                DOM.selectPosicao.innerHTML = '<option value="">Todas as posições</option>';

                await carregarDadosDoSupabase();
                
                const locais = new Set();
                const posicoes = new Set();

                baseDeDadosProcessada.forEach(foto => {
                    if (foto.local_exibicao) locais.add(foto.local_exibicao);
                    if (foto.posicao) posicoes.add(foto.posicao);
                });

                Array.from(locais).sort().forEach(local => {
                    const option = document.createElement('option');
                    option.value = local;
                    option.textContent = local;
                    DOM.selectLocal.appendChild(option);
                });

                Array.from(posicoes).sort().forEach(posicao => {
                    const option = document.createElement('option');
                    option.value = posicao;
                    option.textContent = `Ângulo: ${posicao}`;
                    DOM.selectPosicao.appendChild(option);
                });

                const dataHoje = new Date();
                DOM.graficoMesInput.value = dataHoje.toISOString().substring(0, 7);

                renderizarGrid();
            };

            const renderizarGrid = () => {
                const valLocal = DOM.selectLocal.value;
                const valPosicao = DOM.selectPosicao.value;
                const valData = DOM.inputData.value;

                const fotosFiltradas = baseDeDadosProcessada.filter(foto => {
                    const matchLocal = !valLocal || foto.local_exibicao === valLocal;
                    const matchPosicao = !valPosicao || foto.posicao === valPosicao;
                    const matchData = !valData || foto.data_iso === valData;
                    return matchLocal && matchPosicao && matchData;
                });

                DOM.gridFotos.innerHTML = '';
                DOM.badgeContador.textContent = fotosFiltradas.length;

                if (fotosFiltradas.length === 0) {
                    DOM.gridFotos.classList.add('hidden');
                    DOM.emptyState.classList.remove('hidden');
                    return;
                } else {
                    DOM.gridFotos.classList.remove('hidden');
                    DOM.emptyState.classList.add('hidden');
                }

                fotosFiltradas.forEach(foto => {
                    let dataBr = foto.data_iso;
                    if(foto.data_iso.length === 10) {
                        const p = foto.data_iso.split('-');
                        dataBr = `${p[2]}/${p[1]}/${p[0]}`;
                    }

                    const legendaTexto = `${foto.local_exibicao} | Ângulo: ${foto.posicao} | Data: ${dataBr}`;
                    const card = document.createElement('div');
                    card.className = "group bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col border border-gray-100";
                    
                    const imgSrc = foto.caminho_original; 
                    const fallbackImg = "https://placehold.co/600x600/f1f5f9/94a3b8?text=Imagem+N%C3%A3o+Encontrada";

                    card.innerHTML = `
                        <div class="relative aspect-square bg-gray-100 overflow-hidden border-b border-gray-100">
                            <img src="${imgSrc}" alt="${legendaTexto}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImg}';">
                        </div>
                        <div class="p-4 bg-white text-center mt-auto flex flex-col justify-center min-h-[70px]">
                            <p class="text-sm font-bold text-gray-800">${foto.local_exibicao}</p>
                            <p class="text-xs font-medium text-gray-500 mt-1">Posição: ${foto.posicao} &bull; ${dataBr}</p>
                        </div>
                    `;
                    DOM.gridFotos.appendChild(card);
                });
            };

            [DOM.selectLocal, DOM.selectPosicao, DOM.inputData].forEach(el => el.addEventListener('change', renderizarGrid));

            DOM.btnLimpar.addEventListener('click', () => {
                DOM.selectLocal.value = '';
                DOM.selectPosicao.value = '';
                DOM.inputData.value = '';
                renderizarGrid();
            });

            // === UI & MODAIS ===
            let isMenuOpen = window.innerWidth >= 768; 
            
            const ajustarEstadoSidebarInicial = () => {
                if (!isMenuOpen) {
                    DOM.sidebar.classList.add('-translate-x-full');
                    DOM.mainContent.classList.remove('md:ml-80');
                }
            };
            
            const toggleSidebar = () => {
                isMenuOpen = !isMenuOpen;
                if (isMenuOpen) {
                    DOM.sidebar.classList.remove('-translate-x-full');
                    if (window.innerWidth >= 768) {
                        DOM.mainContent.classList.add('md:ml-80');
                    } else {
                        DOM.mobileOverlay.classList.remove('opacity-0', 'pointer-events-none');
                    }
                } else {
                    DOM.sidebar.classList.add('-translate-x-full');
                    DOM.mainContent.classList.remove('md:ml-80');
                    DOM.mobileOverlay.classList.add('opacity-0', 'pointer-events-none');
                }
            };

            DOM.btnToggleMenu.addEventListener('click', toggleSidebar);
            DOM.mobileOverlay.addEventListener('click', toggleSidebar);

            const abrirModalGrafico = () => {
                DOM.modalGrafico.classList.remove('hidden');
                setTimeout(() => {
                    DOM.modalGrafico.classList.remove('opacity-0');
                    DOM.modalContent.classList.remove('scale-95');
                }, 10);
                gerarGrafico();
            };

            const fecharModalGrafico = () => {
                DOM.modalGrafico.classList.add('opacity-0');
                DOM.modalContent.classList.add('scale-95');
                setTimeout(() => DOM.modalGrafico.classList.add('hidden'), 300);
            };

            DOM.btnGrafico.addEventListener('click', abrirModalGrafico);
            DOM.btnFecharModal.addEventListener('click', fecharModalGrafico);
            DOM.graficoMesInput.addEventListener('change', gerarGrafico);
            DOM.modalGrafico.addEventListener('click', (e) => { if (e.target === DOM.modalGrafico) fecharModalGrafico(); });

            function gerarGrafico() {
                const mesSelecionado = DOM.graficoMesInput.value;
                if (!mesSelecionado) return;

                const [ano, mes] = mesSelecionado.split('-');
                const dadosDoMes = baseDeDadosProcessada.filter(f => f.mes_iso === mesSelecionado);
                const diasNoMes = new Date(ano, mes, 0).getDate();
                
                const labelsDias = [];
                const dadosQuantidade = [];
                const contagemPorDia = {};
                
                dadosDoMes.forEach(foto => {
                    if (foto.data_iso) contagemPorDia[foto.data_iso] = (contagemPorDia[foto.data_iso] || 0) + 1;
                });

                for (let i = 1; i <= diasNoMes; i++) {
                    const diaFormatado = i.toString().padStart(2, '0');
                    labelsDias.push(diaFormatado);
                    dadosQuantidade.push(contagemPorDia[`${mesSelecionado}-${diaFormatado}`] || 0);
                }

                const ctx = document.getElementById('chartAvanco').getContext('2d');
                if (chartInstance) chartInstance.destroy(); 

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labelsDias,
                        datasets: [{
                            label: 'Nº de Fotos no Dia',
                            data: dadosQuantidade,
                            borderColor: '#0284c7',
                            backgroundColor: 'rgba(2, 132, 199, 0.1)',
                            borderWidth: 2,
                            pointBackgroundColor: '#0ea5e9',
                            pointRadius: 4,
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, ticks: { precision: 0 } },
                            x: { title: { display: true, text: `Dias do Mês (${mes}/${ano})` } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }

            // === AÇÃO DO BOTÃO PDF ===
            document.getElementById('btn-baixar-pdf').addEventListener('click', async () => {
                const btn = document.getElementById('btn-baixar-pdf');
                const textoOriginal = btn.innerHTML;
                btn.innerHTML = 'Processando...';
                btn.disabled = true;

                try {
                    // 1. Busca as descrições da nova tabela
                    const { data: descricoesData, error: descError } = await supabaseClient.from('descricoes_diarias').select('*');
                    
                    if (descError) {
                        console.error("Erro ao buscar descrições:", descError);
                    }

                    // 2. Agrupa as fotos existentes por Local -> Data
                    const agrupado = {};
                    
                    baseDeDadosProcessada.forEach(foto => {
                        const loc = foto.local_exibicao;
                        const dt = foto.data_iso; 
                        
                        if (!agrupado[loc]) agrupado[loc] = {};
                        if (!agrupado[loc][dt]) agrupado[loc][dt] = { fotos: [], descricao: 'Sem descrição cadastrada.' };
                        
                        agrupado[loc][dt].fotos.push(foto);
                    });

                    /// 3. Mescla as descrições do Supabase no agrupamento
                    if (descricoesData) {
                        descricoesData.forEach(desc => {
                            const dtBanco = desc.data; 
                            
                            // Localiza a chave exata ignorando maiúsculas/minúsculas e espaços em branco
                            const locKey = Object.keys(agrupado).find(k => 
                                k.trim().toLowerCase() === (desc.local || '').trim().toLowerCase()
                            );
                    
                            if (locKey && agrupado[locKey][dtBanco]) {
                                agrupado[locKey][dtBanco].descricao = desc.descricao;
                            }
                        });
                    }

                    // 4. Constrói o HTML invisível para o PDF (Novo Layout Hierárquico)
                    const relatorioDiv = document.createElement('div');
                    relatorioDiv.style.padding = '10px';
                    relatorioDiv.style.fontFamily = 'Arial, sans-serif'; // Fonte web-safe para textos nítidos
                    relatorioDiv.style.color = '#000';
                    
                    let htmlContent = '';
                    let isFirstPage = true;

                    for (const [local, datas] of Object.entries(agrupado)) {
                        
                        // Quebra de página antes de um novo local (exceto no primeiro)
                        const pageBreak = isFirstPage ? '' : 'page-break-before: always;';
                        isFirstPage = false;

                        // Título do Local
                        htmlContent += `
                            <div style="${pageBreak} padding-top: 10px;">
                                <h1 style="text-transform: uppercase; font-size: 22px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 20px; letter-spacing: 0.5px;">${local}</h1>
                        `;

                        // Ordena as datas de forma crescente
                        const datasOrdenadas = Object.keys(datas).sort();

                        for (const dataIso of datasOrdenadas) {
                            const info = datas[dataIso];
                            const p = dataIso.split('-');
                            const dataBr = `${p[2]}/${p[1]}/${p[0]}`;

                            info.fotos.sort((a, b) => a.posicao.localeCompare(b.posicao));

                            // Bloco da Data e Descrição
                            htmlContent += `
                                <div style="margin-bottom: 30px;">
                                    <div style="background-color: #f3f4f6; padding: 10px 15px; margin-bottom: 15px; border-left: 4px solid #0284c7; page-break-inside: avoid;">
                                        <h2 style="font-size: 16px; margin: 0 0 5px 0; color: #333; font-weight: bold;">Registro Diário - ${dataBr}</h2>
                                        <p style="font-size: 14px; margin: 0; color: #111;">${info.descricao}</p>
                                    </div>
                                    <div style="display: block; width: 100%;">
                            `;
                            
                            // Fotos daquela data (inline-block em vez de flex para garantir a quebra correta)
                            info.fotos.forEach((f, index) => {
                                // Adiciona margem apenas no elemento ímpar (esquerda) para simular o grid
                                const marginR = (index % 2 === 0) ? 'margin-right: 2%;' : 'margin-right: 0;';
                                htmlContent += `
                                        <div style="display: inline-block; width: 49%; ${marginR} text-align: center; margin-bottom: 15px; page-break-inside: avoid; vertical-align: top;">
                                            <img src="${f.caminho_original}" style="width: 100%; height: 260px; object-fit: cover; border: 1px solid #000; border-radius: 2px;">
                                            <p style="font-size: 12px; margin-top: 5px; font-weight: bold; color: #000;">Posição: ${f.posicao}</p>
                                        </div>
                                `;
                            });
                            
                            htmlContent += `
                                    </div>
                                </div>
                            `;

                            // Fotos daquela data (com page-break-inside para evitar corte no meio da foto)
                            info.fotos.forEach(f => {
                                htmlContent += `
                                        <div style="width: 48%; text-align: center; margin-bottom: 15px; page-break-inside: avoid;">
                                            <img src="${f.caminho_original}" style="width: 100%; height: 260px; object-fit: cover; border: 1px solid #000; border-radius: 2px;">
                                            <p style="font-size: 12px; margin-top: 5px; font-weight: bold; color: #000;">Posição: ${f.posicao}</p>
                                        </div>
                                `;
                            });

                            htmlContent += `
                                    </div>
                                </div>
                            `;
                        }

                        // Fecha a div do Local
                        htmlContent += `</div>`;
                    }

                    relatorioDiv.innerHTML = htmlContent;

                    // 1. Anexa a div de forma invisível na tela para forçar o carregamento das imagens
                    relatorioDiv.style.position = 'absolute';
                    relatorioDiv.style.left = '-9999px';
                    relatorioDiv.style.top = '0';
                    document.body.appendChild(relatorioDiv);

                    // 2. Configura e gera o PDF (Scale ajustado para 2)
                    const opt = {
                        margin:       [10, 10, 10, 10], 
                        filename:     'Relatorio_Avanco_Fisico.pdf',
                        image:        { type: 'jpeg', quality: 0.98 }, 
                        html2canvas:  { scale: 2, useCORS: true }, // Scale 2 evita o limite de memória da GPU
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak:    { mode: ['css', 'legacy'] }
                    };

                    // 3. Força um atraso de 800ms para garantir que o DOM renderizou as imagens
                    await new Promise(resolve => setTimeout(resolve, 800));

                    // 4. Gera o arquivo
                    await html2pdf().set(opt).from(relatorioDiv).save();

                    // 5. Remove a div invisível para limpar a tela
                    document.body.removeChild(relatorioDiv);

                } catch (error) {
                    console.error("Erro ao gerar PDF:", error);
                    alert("Ocorreu um erro ao gerar o PDF. Verifique o console.");
                } finally {
                    btn.innerHTML = textoOriginal;
                    btn.disabled = false;
                }
            });
        }); // Fim do DOMContentLoaded
    </script>
</body>
</html>
